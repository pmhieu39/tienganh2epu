<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn Tập Anh 2 (B1 Reading) – Hệ Thống Học & Luyện Đề Cương</title>

  <!-- Hệ thống 11 file CSS theo module -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/practice.css" />
  <link rel="stylesheet" href="css/exam.css" />
  <link rel="stylesheet" href="css/results.css" />
  <link rel="stylesheet" href="css/review.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Backdrop cho Mobile Sidebar -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar điều hướng bên trái -->
    <aside class="sidebar" id="app-sidebar" aria-label="Menu điều hướng chính">
      <div class="sidebar-brand">
        <div class="brand-logo">B1</div>
        <div class="brand-text">
          <h1>Đề Cương Anh 2 pmh</h1>
          <span>Luyện Đọc B1 · 305 Câu</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Tổng quan & Chế độ</div>
        <button type="button" class="nav-item active" data-page="dashboard">
          <span class="nav-item-left"><span>🏠</span><span>Trang chủ Dashboard</span></span>
        </button>
        <button type="button" class="nav-item" data-page="practice-modes">
          <span class="nav-item-left"><span>🎯</span><span>5 Chế độ luyện tập</span></span>
        </button>
        <button type="button" class="nav-item" data-page="exam-builder">
          <span class="nav-item-left"><span>⚙️</span><span>Tạo bài kiểm tra</span></span>
        </button>
        <button type="button" class="nav-item" data-page="study-card">
          <span class="nav-item-left"><span>📖</span><span>Học từng câu (Flashcard)</span></span>
        </button>

        <div class="nav-section-label">Học theo 5 Part (41 Đề)</div>
        <div id="sidebar-parts-list"></div>

        <div class="nav-section-label">Ôn tập & Phân tích</div>
        <button type="button" class="nav-item" data-page="wrong-book">
          <span class="nav-item-left"><span>📕</span><span>Sổ câu sai (1-3-7d)</span></span>
          <span class="nav-badge" id="nav-wrong-badge">0</span>
        </button>
        <button type="button" class="nav-item" data-page="search">
          <span class="nav-item-left"><span>🔍</span><span>Tìm kiếm & Yêu thích</span></span>
        </button>
        <button type="button" class="nav-item" data-page="history">
          <span class="nav-item-left"><span>📊</span><span>Lịch sử & So sánh thi</span></span>
        </button>
        <button type="button" class="nav-item" data-page="guide">
          <span class="nav-item-left"><span>📘</span><span>Hướng dẫn & Đối chiếu</span></span>
        </button>
        <button type="button" class="nav-item" data-page="settings">
          <span class="nav-item-left"><span>🛠️</span><span>Cài đặt & Sao lưu</span></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div style="font-weight:700;color:var(--text-primary);">Hỗ trợ Offline 100%</div>
        <div style="color:var(--text-muted);margin-top:0.15rem;">Lưu tự động trên trình duyệt</div>
      </div>
    </aside>

    <!-- Khu vực chính -->
    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button type="button" class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Mở menu">
            ☰
          </button>
          <div class="header-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="header-search-input" placeholder="Tìm nhanh câu hỏi, từ vựng, bài đọc (Nhấn Enter)..." aria-label="Tìm kiếm câu hỏi" />
          </div>
        </div>

        <div class="header-right">
          <div class="header-progress-pill" id="header-progress-text">
            Tiến độ: 0/305 câu (0% đúng)
          </div>
          <div class="streak-badge" id="header-streak-text" title="Chuỗi ngày học liên tiếp">
            🔥 0 ngày
          </div>
          <button type="button" class="icon-btn" id="header-theme-btn" aria-label="Đổi giao diện Sáng/Tối" title="Đổi Light/Dark Mode">
            🌙
          </button>
          <button type="button" class="icon-btn" id="header-settings-btn" aria-label="Cài đặt" title="Cài đặt & Sao lưu">
            ⚙️
          </button>
        </div>
      </header>

      <main class="main-content" id="app-main-content" role="main">
        <div class="card empty-state">
          <h3>Đang tải dữ liệu đề cương Anh 2...</h3>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal xác nhận dùng chung -->
  <div class="modal-overlay hidden" id="app-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="app-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="app-modal-title" style="font-size:1.08rem;font-weight:800;">Thông báo</h3>
        <button type="button" class="btn-sm" onclick="window.AppUtils.closeModal()" aria-label="Đóng">✕</button>
      </div>
      <div id="app-modal-body" style="font-size:0.92rem;color:var(--text-secondary);"></div>
      <div class="modal-footer" id="app-modal-footer"></div>
    </div>
  </div>

  <!-- Khay thông báo Toast -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Dữ liệu nhúng dự phòng giúp chạy trực tiếp file:// offline không bị lỗi CORS -->
  <script src="data/embedded-data.js"></script>

  <!-- Hệ thống 16 file JavaScript theo module -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/router.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/question-renderer.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/exam-config.js"></script>
  <script src="js/exam-engine.js"></script>
  <script src="js/review.js"></script>
  <script src="js/search.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
